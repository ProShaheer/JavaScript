<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operators in javascript </title>
    <script>
        let a = 45;
        let b = 2;
        console.log("operators in javaScript")
        console.log("a X b = " , a*b)
        console.log("a + b = " , a+b)
        console.log("a - b = " , a-b)
        console.log("a / b = " , a/b)
        console.log("a ** b = " , a**b)
        console.log("a % b = " , a%b)
        a-=10
        console.log(a)
        
    </script>
</head>
<body>
    Operators in javascript
</body>
</html>
